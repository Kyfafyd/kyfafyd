name: Update profile stats

on:
  schedule:
    - cron: '0 0 * * *'  # 每天更新
  workflow_dispatch:  # 允许手动触发
  push:
    branches: [main]
    paths:
      - .github/workflows/update-profile.yml
      - .github/scripts/count_stars.py

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Stars are left off this card because it only counts repos the user owns; count_stars.py covers them.
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide=prs,stars&hide_title=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&exclude_repo=HDL-ZJU&hide_title=true&langs_count=4
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Count stars
        run: python3 .github/scripts/count_stars.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile
          git commit -m "Update profile stats" || exit 0
          git push
